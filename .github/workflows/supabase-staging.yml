name: Deploy Supabase Staging
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: supabase-staging
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate staging configuration
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"
      - name: Link staging project
        run: npx --yes supabase@2.120.0 link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Apply reviewed migrations
        run: npx --yes supabase@2.120.0 db push --linked --include-all
      - name: Deploy Edge Functions
        run: |
          npx --yes supabase@2.120.0 functions deploy checkout --project-ref "$SUPABASE_PROJECT_REF"
          npx --yes supabase@2.120.0 functions deploy buyer-application --project-ref "$SUPABASE_PROJECT_REF"
          npx --yes supabase@2.120.0 functions deploy maintenance --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
