name: Free-tier Health Check

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify storefront and Supabase REST availability
        env:
          STOREFRONT_URL: ${{ vars.STOREFRONT_URL }}
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          test -n "$STOREFRONT_URL"
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_ANON_KEY"
          curl --fail --silent --show-error --max-time 15 "$STOREFRONT_URL" >/dev/null
          curl --fail --silent --show-error --max-time 15 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/" >/dev/null
